name: Daily Outreach

on:
  schedule:
    # 9:00am ET = 14:00 UTC (EST winter). EDT summer = 13:00 UTC.
    # 13:30 UTC splits the difference — runs between 9:00–9:30am year-round.
    - cron: '30 13 * * 1-5'
  workflow_dispatch:
    inputs:
      category:
        description: 'Business category (e.g. restaurant, dental office)'
        required: false
        default: ''
      city:
        description: 'City (e.g. Miami, FL)'
        required: false
        default: ''
      target:
        description: 'Number of emails to send'
        required: false
        default: '20'

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 ddgs
          sudo apt-get install -y dnsutils 2>/dev/null || true

      - name: Run outreach
        env:
          YELP_API_KEY: ${{ secrets.YELP_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          TARGET="${{ github.event.inputs.target || '20' }}"

          EXTRA_ARGS=""
          if [[ -n "${{ github.event.inputs.category }}" ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --category '${{ github.event.inputs.category }}'"
          fi
          if [[ -n "${{ github.event.inputs.city }}" ]]; then
            EXTRA_ARGS="$EXTRA_ARGS --city '${{ github.event.inputs.city }}'"
          fi

          echo "=== SiteSafe Outreach — $DATE ==="
          echo "Target: $TARGET emails"

          python3 scripts/outreach.py \
            --target "$TARGET" \
            --send \
            --output /tmp/outreach-$DATE.csv \
            $EXTRA_ARGS

      - name: Summary
        run: |
          DATE=$(date +%Y-%m-%d)
          CSV="/tmp/outreach-$DATE.csv"
          if [[ -f "$CSV" ]]; then
            echo "=== Results ==="
            python3 -c "
          import csv
          with open('$CSV') as f:
              rows = list(csv.DictReader(f))
          total  = len(rows)
          emails = sum(1 for r in rows if r.get('email'))
          sent   = sum(1 for r in rows if r.get('status') == 'sent')
          failed = sum(1 for r in rows if r.get('status') == 'failed')
          print(f'Processed  : {total}')
          print(f'With email : {emails}')
          print(f'Sent       : {sent}')
          print(f'Failed     : {failed}')
          "
            echo ""
            echo "Dashboard: https://adalawsuitcheck.com/outreach/"
          else
            echo "No CSV generated"
          fi
