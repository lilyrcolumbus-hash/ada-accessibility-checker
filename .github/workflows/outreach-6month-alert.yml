name: Outreach 6-Month Check-In

on:
  schedule:
    # Nov 26, 2026 at 10:00am ET (15:00 UTC)
    - cron: "0 15 26 11 *"
  workflow_dispatch:  # run manually anytime to test

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Send 6-month reminder email
        run: |
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "lily@adalawsuitcheck.com",
              "to": ["lyhoffllc.info@gmail.com"],
              "subject": "SiteSafe Outreach — 6-Month Check-In",
              "html": "<h2>6-Month Outreach Check-In</h2><p>Han pasado 6 meses desde que arrancó el outreach automático. Aquí lo que revisar:</p><ul><li><strong>Resend:</strong> entra a resend.com/dashboard → verifica bounces y spam reports. Si bounces > 2%, revisa la lista de contactados.</li><li><strong>Supabase:</strong> verifica que el proyecto no esté pausado en supabase.com (Free tier pausa sin tráfico).</li><li><strong>Dominio:</strong> adalawsuitcheck.com vence en junio 2027 — confirma auto-renovación en Cloudflare Registrar.</li><li><strong>Yelp API:</strong> verifica que la key siga activa en fusion.yelp.com.</li><li><strong>Resultados:</strong> revisa cuántas respuestas recibiste en lyhoffllc.info@gmail.com y qué convirtió.</li></ul><p>Si todo está bien, el outreach sigue automático sin tocar nada. 🎉</p>"
            }'
          echo "Alert email sent!"
