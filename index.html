    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is ADA website compliance?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ADA (Americans with Disabilities Act) website compliance means your website meets WCAG 2.1 AA accessibility standards, making it usable by people with disabilities. This includes proper image descriptions, sufficient color contrast, keyboard navigation, and screen reader compatibility. The DOJ has set April 26, 2026 as the deadline for all public-facing websites to comply."
          }
        },
        {
          "@type": "Question",
          "name": "Can I get sued for a non-compliant website?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. In 2023 alone, there were 4,605 ADA website accessibility lawsuits filed in the US, with 67% targeting small businesses. Typical settlements range from $5,000 to $20,000, and defense costs can reach $50,000 to $100,000. States like New York, Florida, and California have the highest lawsuit volumes."
          }
        },
        {
          "@type": "Question",
          "name": "How does SiteSafe differ from accessibility overlays like accessiBe?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Unlike accessibility overlays (which were shown to be ineffective — accessiBe was fined $1M by the FTC), SiteSafe provides actual code fixes you can copy and paste into your website. Overlays add a JavaScript widget on top of your site without fixing the underlying code, while SiteSafe identifies each specific issue and gives you the exact code change needed to fix it."
          }
        },
        {
          "@type": "Question",
          "name": "How much does it cost to make my website ADA compliant?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "With SiteSafe, you can scan your website for free and get a full accessibility audit with all code fixes for $49 one-time. Ongoing monitoring with unlimited re-scans is $199/year ($17/month). Compare this to the typical ADA lawsuit settlement of $5,000 to $20,000 or accessibility consultants charging $3,000 to $10,000 per audit."
          }
        },
        {
          "@type": "Question",
          "name": "What is the ADA website compliance deadline?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The U.S. Department of Justice has set April 26, 2026 as the compliance deadline for websites of state and local government entities with populations of 50,000 or more. Private businesses are already subject to ADA Title III requirements, and courts increasingly use WCAG 2.1 AA as the standard for compliance."
          }
        },
        {
          "@type": "Question",
          "name": "What industries are most targeted by ADA lawsuits?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "E-commerce and retail businesses are the most targeted, with over 1,800 lawsuits in 2023. Other high-risk industries include restaurants, hotels, healthcare, dental practices, and financial services. 67% of all ADA web accessibility lawsuits target small businesses with under $25M in revenue."
          }
        }
      ]
    }
    </script>
