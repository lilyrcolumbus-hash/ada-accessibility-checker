[build]
  command = "npm run build"
  publish = "dist"

# Proxy scan requests to Supabase edge function (same-origin, no CORS issues)
[[redirects]]
  from = "/api/scan"
  to = "https://mvzolbabbkedmlhqhiwi.supabase.co/functions/v1/scan"
  status = 200
  force = true
  headers = {X-Custom-Proxy = "netlify"}

# SPA fallback (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
