<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiteSafe Commissions</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1117;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;min-height:100vh;padding-bottom:40px}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.hdr{margin-bottom:20px}
.hdr h1{font-size:18px;font-weight:700}
.hdr h1 span{color:#22c55e}
.hdr p{font-size:12px;color:#64748b;margin-top:3px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.stat{background:#1e2130;border-radius:12px;padding:14px 16px}
.stat-num{font-size:24px;font-weight:800;line-height:1}
.stat-num.green{color:#4ade80}
.stat-num.amber{color:#fbbf24}
.stat-label{font-size:11px;color:#94a3b8;margin-top:4px}

.section-title{font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin:20px 0 10px}

.partner-card{background:#1e2130;border-radius:12px;padding:14px 16px;margin-bottom:10px}
.partner-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.partner-name{font-size:14px;font-weight:700}
.partner-owed{font-size:16px;font-weight:800;color:#fbbf24}
.partner-owed.zero{color:#4ade80}
.partner-meta{font-size:11px;color:#64748b}

table{width:100%;border-collapse:collapse;background:#1e2130;border-radius:12px;overflow:hidden;font-size:12px}
th{text-align:left;padding:10px 12px;color:#64748b;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #252840}
td{padding:10px 12px;border-bottom:1px solid #252840}
tr:last-child td{border-bottom:none}
.badge{border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.badge.paid{background:rgba(34,197,94,.15);color:#4ade80}
.badge.pending{background:rgba(251,191,36,.15);color:#fbbf24}
.empty{color:#64748b;font-size:13px;text-align:center;padding:30px 0}
.note{font-size:11px;color:#475569;margin-top:16px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1>SiteSafe <span>Commissions</span></h1>
    <p>Partner referral tracking — read-only</p>
  </div>

  <div class="stats" id="stats"></div>

  <div class="section-title">By partner</div>
  <div id="partners"></div>

  <div class="section-title">All commissions</div>
  <table>
    <thead><tr><th>Partner</th><th>Plan</th><th>Customer paid</th><th>Commission</th><th>Status</th><th>Date</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <p class="note">To mark a commission as paid: Supabase Table Editor &rarr; <code>purchases</code> &rarr; find the row &rarr; toggle <code>paid</code>. This page is read-only.</p>
</div>

<script>
const SB='https://mvzolbabbkedmlhqhiwi.supabase.co';
const AK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12em9sYmFiYmtlZG1saHFoaXdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0MDgzOTAsImV4cCI6MjA4Nzk4NDM5MH0.F-Ywz77JpmL-UqYIMR4p2oTcqrsFNvh8c5v-MNOXtzU';
const H={apikey:AK,Authorization:'Bearer '+AK,'Content-Type':'application/json'};

function money(cents){return '$'+((cents||0)/100).toFixed(2);}
function esc(s){const e=document.createElement('div');e.textContent=s||'';return e.innerHTML;}
function fd(iso){const d=new Date(iso);return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}

async function init(){
  let rows=[];
  try{
    const r=await fetch(SB+'/rest/v1/rpc/get_commissions',{method:'POST',headers:H,body:'{}'});
    rows=r.ok?await r.json():[];
  }catch{rows=[];}

  const totalOwed=rows.filter(r=>!r.paid).reduce((s,r)=>s+(r.commission_amount||0),0);
  const totalPaid=rows.filter(r=>r.paid).reduce((s,r)=>s+(r.commission_amount||0),0);
  const partners={};
  rows.forEach(r=>{
    const p=r.referred_by||'(unknown)';
    partners[p]=partners[p]||{owed:0,paid:0,count:0};
    partners[p].count++;
    if(r.paid){partners[p].paid+=r.commission_amount||0;}else{partners[p].owed+=r.commission_amount||0;}
  });

  document.getElementById('stats').innerHTML=
    '<div class="stat"><div class="stat-num amber">'+money(totalOwed)+'</div><div class="stat-label">Owed (unpaid)</div></div>'+
    '<div class="stat"><div class="stat-num green">'+money(totalPaid)+'</div><div class="stat-label">Already paid</div></div>';

  const partnerEntries=Object.entries(partners).sort((a,b)=>b[1].owed-a[1].owed);
  document.getElementById('partners').innerHTML=partnerEntries.length? partnerEntries.map(([name,p])=>
    '<div class="partner-card"><div class="partner-top">'+
      '<div class="partner-name">'+esc(name)+'</div>'+
      '<div class="partner-owed'+(p.owed===0?' zero':'')+'">'+money(p.owed)+' owed</div>'+
    '</div><div class="partner-meta">'+p.count+' sale(s) &middot; '+money(p.paid)+' already paid</div></div>'
  ).join('') : '<div class="empty">No referred sales yet.</div>';

  document.getElementById('rows').innerHTML=rows.length? rows.map(r=>
    '<tr><td>'+esc(r.referred_by)+'</td><td>'+esc(r.plan)+'</td><td>'+money(r.amount)+'</td><td>'+money(r.commission_amount)+'</td>'+
    '<td><span class="badge '+(r.paid?'paid':'pending')+'">'+(r.paid?'Paid':'Pending')+'</span></td><td>'+fd(r.created_at)+'</td></tr>'
  ).join('') : '<tr><td colspan="6" class="empty">No referred sales yet.</td></tr>';
}
init();
</script>
</body>
</html>
